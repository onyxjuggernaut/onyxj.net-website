<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnyxJuggernaut</title>
<link rel="canonical" href="https://onyxjuggernaut.com/">
<meta http-equiv="refresh" content="0; url=https://onyxjuggernaut.com/">
<style>
  :root{
    --bg:#07050c;
    --purple:#a855f7;
    --cyan:#22d3ee;
    --muted:#b8aec8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:Inter,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 15% 0,rgba(168,85,247,.2),transparent 30%),
      radial-gradient(circle at 88% 25%,rgba(34,211,238,.09),transparent 28%),
      var(--bg);
    padding:24px;
  }
  p{color:var(--muted);font-size:16px;margin-top:12px}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
<script>
  window.location.replace("https://onyxjuggernaut.com/");
</script>
</head>
<body>
  <div>
    <p>Redirecting to <a href="https://onyxjuggernaut.com/">onyxjuggernaut.com</a>&hellip;</p>
  </div>
</body>
</html>
